<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Grove &amp; Co.</title>
  <link rel="stylesheet" href="css/style.css">

<body>

  <header>
    <div class="nav-inner">
      <a href="index.html" class="logo">Grove <span>&amp; Co.</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span id="cart-badge" style="display:none">0</span>)</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title">Checkout</h2>
    <p class="section-subtitle">Complete your order</p>

    <div class="checkout-grid">
      <div class="checkout-form">
        <h2>Shipping Information</h2>
        <form id="checkout-form" onsubmit="handleCheckout(event)">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" required>
            </div>
            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" required>
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" required>
          </div>
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" required>
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" required>
            </div>
            <div class="form-group">
              <label for="zip">ZIP</label>
              <input type="text" id="zip" required>
            </div>
          </div>

          <h2 style="margin-top:2rem;">Payment</h2>
          <div class="form-group">
            <label for="card">Card Number</label>
            <input type="text" id="card" placeholder="4242 4242 4242 4242" required>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="expiry">Expiry</label>
              <input type="text" id="expiry" placeholder="MM/YY" required>
            </div>
            <div class="form-group">
              <label for="cvv">CVV</label>
              <input type="text" id="cvv" placeholder="123" required>
            </div>
          </div>

          <button type="submit" class="btn btn-checkout" style="margin-top:1.5rem;">Place Order</button>
        </form>
      </div>

      <div class="order-summary">
        <h3>Order Summary</h3>
        <div id="order-items"></div>
        <div style="margin-top:1rem;border-top:2px solid var(--border);padding-top:0.8rem;">
          <div class="line" style="display:flex;justify-content:space-between;margin-bottom:0.4rem;">
            <span>Subtotal</span><span id="order-subtotal"></span>
          </div>
          <div class="line" style="display:flex;justify-content:space-between;margin-bottom:0.4rem;">
            <span>Shipping</span><span id="order-shipping"></span>
          </div>
          <div class="line" style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-top:0.5rem;">
            <span>Total</span><span id="order-total"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Grove &amp; Co. All rights reserved. | <a href="contact.html">Contact Us</a></p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    /* Render order summary */
    function renderSummary() {
      const items = Cart.get();
      const container = document.getElementById('order-items');
      container.innerHTML = '';

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'order-item';
        div.innerHTML = `<span>${item.emoji || ''} ${item.name} × ${item.qty}</span><span>$${(item.price * item.qty).toFixed(2)}</span>`;
        container.appendChild(div);
      });

      const total = Cart.total();
      const shipping = total >= 50 ? 0 : 5;
      document.getElementById('order-subtotal').textContent = `$${total.toFixed(2)}`;
      document.getElementById('order-shipping').textContent = shipping === 0 ? 'Free' : `$${shipping.toFixed(2)}`;
      document.getElementById('order-total').textContent = `$${(total + shipping).toFixed(2)}`;
    }

    /* Handle checkout — would trigger Purchase event */
    function handleCheckout(e) {
      e.preventDefault();

      const total = Cart.total();
      const shipping = total >= 50 ? 0 : 5;
      const orderTotal = total + shipping;

      /* Store order info for thank-you page */
      const orderData = {
        items: Cart.get(),
        subtotal: total,
        shipping: shipping,
        total: orderTotal,
        orderId: 'GRV-' + Math.random().toString(36).substr(2, 8).toUpperCase(),
        email: document.getElementById('email').value
      };
      sessionStorage.setItem('grove_order', JSON.stringify(orderData));

      Cart.clear();
      window.location.href = 'thankyou.html';
    }

    renderSummary();
  </script>
</body>
</html>
